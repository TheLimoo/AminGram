name: Build AminGram

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout AminGram overlay
        uses: actions/checkout@v4

      - name: Fetch upstream Telegram source (pinned)
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/DrKLO/Telegram.git upstream
          cd upstream && git fetch --depth 1 origin f32ffeec763f0bdbf4bec25b52d654f77bff733d && git checkout FETCH_HEAD && git log --oneline -1

      - name: Apply AminGram overlay
        run: |
          cp -r TMessagesProj upstream/
          cd upstream
          git apply ../patches/0001-settings-plugins-entry.patch
          git apply ../patches/0002-rebrand-package.patch
          git apply ../patches/0003-phase2-hooks.patch
          git apply ../patches/0004-videobg-rebrand.patch
          git apply ../patches/0006-message-pipeline-hook.patch
          git apply ../patches/0007-icon-changer.patch
          git apply ../patches/0008-hide-stories.patch
          git apply ../patches/0009-profile-user-id.patch
          git apply ../patches/0010-js-runtime-gradle.patch
          git apply ../patches/0011-hidden-chats-dialogs-filter.patch
          git apply ../patches/0012-ghost-stories.patch
          git apply ../patches/0013-outgoing-command-hook.patch
          git apply ../patches/0014-attach-menu-plugins.patch
          git apply ../patches/0016-google-auth.patch
          git apply ../patches/0017-hide-sponsored.patch
          git apply ../patches/0018-message-details.patch
          git apply ../patches/0019-screenshot-unlock.patch
          git apply ../patches/0020-context-menu-items.patch
          git apply ../patches/0021-dns-tunnel.patch
          git apply ../patches/0022-ryoku-ui.patch

      - name: Register fork package in google-services.json
        run: |
          python3 - <<'PYEOF'
          import json, copy
          path = "upstream/TMessagesProj_App/google-services.json"
          with open(path) as f:
              data = json.load(f)
          clients = data.get("client", [])
          base = None
          for c in clients:
              if c.get("client_info", {}).get("android_client_info", {}).get("package_name") == "org.telegram.messenger":
                  base = c
                  break
          assert base is not None, "upstream org.telegram.messenger client not found"
          have = {c.get("client_info", {}).get("android_client_info", {}).get("package_name") for c in clients}
          for pkg in ("org.telegram.amingram", "org.telegram.amingram.beta"):
              if pkg in have:
                  continue
              clone = copy.deepcopy(base)
              clone["client_info"]["android_client_info"]["package_name"] = pkg
              clients.append(clone)
          data["client"] = clients
          with open(path, "w") as f:
              json.dump(data, f, indent=2)
          print("google-services.json clients:", sorted(
              c["client_info"]["android_client_info"]["package_name"] for c in clients))
          PYEOF

      - name: Install AminGram signing keystore
        env:
          AMINGRAM_KEYSTORE_B64: ${{ secrets.AMINGRAM_KEYSTORE_B64 }}
        run: |
          echo "$AMINGRAM_KEYSTORE_B64" | base64 -d > upstream/TMessagesProj/config/release.keystore
          test -s upstream/TMessagesProj/config/release.keystore

      - name: Inject API credentials from secrets
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          cd upstream
          sed -i "s/public static int APP_ID = 4;/public static int APP_ID = ${API_ID};/" TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          sed -i 's/public static String APP_HASH = "014b35b6184100b085b0d0572f9b5103";/public static String APP_HASH = "'"${API_HASH}"'";/' TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          grep -c "APP_ID" TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Restore cached NDK
        id: ndk-cache
        uses: actions/cache/restore@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/27.2.12479018
          key: ndk-27.2.12479018

      - name: Install NDK 27.2.12479018
        id: ndk-install
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          ok=0
          for i in 1 2 3; do
            if "$SDKMANAGER" "ndk;27.2.12479018"; then ok=1; break; fi
            echo "sdkmanager attempt $i failed; retrying in 15s"
            rm -rf /usr/local/lib/android/sdk/ndk/27.2.12479018
            sleep 15
          done
          test "$ok" = 1 && test -f /usr/local/lib/android/sdk/ndk/27.2.12479018/source.properties
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Save NDK cache
        if: steps.ndk-install.outputs.ok == 'true'
        uses: actions/cache/save@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/27.2.12479018
          key: ndk-27.2.12479018

      - name: Set up Go 1.25 (Soar)
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build Soar bridge .aar (gomobile)
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.2.12479018
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          cd dns-native/soarbridge
          go get -tool golang.org/x/mobile/cmd/gobind@latest
          gomobile init
          gomobile bind -target=android -androidapi 23 -javapkg org.telegram.amingram -o soarbridge.aar .
          mkdir -p ../../upstream/TMessagesProj/libs
          cp soarbridge.aar ../../upstream/TMessagesProj/libs/

      - name: Build release APK (afat)
        env:
          AMINGRAM_KEYSTORE_PASSWORD: ${{ secrets.AMINGRAM_KEYSTORE_PASSWORD }}
          AMINGRAM_KEY_ALIAS: ${{ secrets.AMINGRAM_KEY_ALIAS }}
          AMINGRAM_KEY_PASSWORD: ${{ secrets.AMINGRAM_KEY_PASSWORD }}
        run: |
          cd upstream
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatRelease --stacktrace -PRELEASE_STORE_PASSWORD="$AMINGRAM_KEYSTORE_PASSWORD" -PRELEASE_KEY_ALIAS="$AMINGRAM_KEY_ALIAS" -PRELEASE_KEY_PASSWORD="$AMINGRAM_KEY_PASSWORD"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AminGram-apk
          path: upstream/TMessagesProj_App/build/outputs/apk/afat/release/*.apk
          if-no-files-found: warn

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v13.0.2-amingram.${{ github.run_number }}
          name: AminGram ${{ github.run_number }}
          files: upstream/TMessagesProj_App/build/outputs/apk/afat/release/*.apk
          fail_on_unmatched_files: true
