name: Build AminGram

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout AminGram overlay
        uses: actions/checkout@v4

      - name: Fetch upstream Telegram source (pinned)
        run: |
          # Submodules are cloned at HEAD's pins; checkout alone leaves them
          # behind 21f7d10 (e.g. tgcalls lost MtProtoIceTransport.cpp upstream,
          # which broke CMake). Re-pin them explicitly after checkout.
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/DrKLO/Telegram.git upstream
          cd upstream && git fetch --depth 1 origin 21f7d109da6ab3506c9e9577f98c6a38771ab335 && git checkout FETCH_HEAD && git submodule update --init --recursive --depth 1 && git log --oneline -1

      - name: Apply AminGram overlay
        run: |
          cp -r TMessagesProj upstream/
          cd upstream
          # Apply every patch in patches/ in filename order.
          # (A hardcoded list silently dropped 0029 in Fix 1:
          # the patch existed in the repo but the workflow
          # never applied it, so the minSdk fix never reached
          # the build. A loop cannot drift from the directory.)
          for p in ../patches/*.patch; do
            echo "git apply $p"
            git apply "$p"
          done
          python3 - <<'SPEEDEOF'
          flo_path = "TMessagesProj/src/main/java/org/telegram/messenger/FileLoadOperation.java"
          with open(flo_path, "r", encoding="utf-8") as f:
              flo = f.read()
          target = "maxDownloadRequestsBig = 8;"
          hook = "maxDownloadRequestsBig = org.telegram.messenger.amin.AminHooks.downloadBoostMaxRequests(forceSmallChunk) > 0 ? org.telegram.messenger.amin.AminHooks.downloadBoostMaxRequests(forceSmallChunk) : 8; if (org.telegram.messenger.amin.AminHooks.downloadBoostBigChunkBytes(forceSmallChunk) > 0) { downloadChunkSizeBig = org.telegram.messenger.amin.AminHooks.downloadBoostBigChunkBytes(forceSmallChunk); }"
          if target in flo and "downloadBoostMaxRequests" not in flo:
              flo = flo.replace(target, hook, 1)
              with open(flo_path, "w", encoding="utf-8") as f:
                  f.write(flo)
          fuo_path = "TMessagesProj/src/main/java/org/telegram/messenger/FileUploadOperation.java"
          with open(fuo_path, "r", encoding="utf-8") as f:
              fuo = f.read()
          utarget = "uploadChunkSize = 64 * 1024;"
          uhook = "uploadChunkSize = org.telegram.messenger.amin.AminHooks.uploadSpeedBoostEnabled() ? 512 * 1024 : 64 * 1024;"
          if utarget in fuo and "uploadSpeedBoostEnabled" not in fuo:
              fuo = fuo.replace(utarget, uhook, 1)
              with open(fuo_path, "w", encoding="utf-8") as f:
                  f.write(fuo)
          SPEEDEOF

      - name: Register fork package in google-services.json
        run: |
          python3 - <<'PYEOF'
          import json, copy
          path = "upstream/TMessagesProj_App/google-services.json"
          with open(path) as f:
              data = json.load(f)
          clients = data.get("client", [])
          base = None
          for c in clients:
              if c.get("client_info", {}).get("android_client_info", {}).get("package_name") == "org.telegram.messenger":
                  base = c
                  break
          assert base is not None, "upstream org.telegram.messenger client not found"
          have = {c.get("client_info", {}).get("android_client_info", {}).get("package_name") for c in clients}
          for pkg in ("org.telegram.amingram", "org.telegram.amingram.beta"):
              if pkg in have:
                  continue
              clone = copy.deepcopy(base)
              clone["client_info"]["android_client_info"]["package_name"] = pkg
              clients.append(clone)
          data["client"] = clients
          with open(path, "w") as f:
              json.dump(data, f, indent=2)
          print("google-services.json clients:", sorted(
              c["client_info"]["android_client_info"]["package_name"] for c in clients))
          PYEOF

      - name: Install AminGram signing keystore
        env:
          AMINGRAM_KEYSTORE_B64: ${{ secrets.AMINGRAM_KEYSTORE_B64 }}
        run: |
          echo "$AMINGRAM_KEYSTORE_B64" | base64 -d > upstream/TMessagesProj/config/release.keystore
          test -s upstream/TMessagesProj/config/release.keystore

      - name: Inject API credentials from secrets
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          cd upstream
          sed -i "s/public static int APP_ID = 4;/public static int APP_ID = ${API_ID};/" TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          sed -i 's/public static String APP_HASH = "014b35b6184100b085b0d0572f9b5103";/public static String APP_HASH = "'"${API_HASH}"'";/' TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          grep -c "APP_ID" TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Python 3.11 (Chaquopy build requirement)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # Chaquopy requires the build-machine Python to match the
          # app's pinned Python version (3.11, patch 0025); the
          # ubuntu runner's default Python is not 3.11.

      - name: Restore cached NDK
        id: ndk-cache
        uses: actions/cache/restore@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/27.2.12479018
          key: ndk-27.2.12479018

      - name: Install NDK 27.2.12479018
        id: ndk-install
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          ok=0
          for i in 1 2 3; do
            if "$SDKMANAGER" "ndk;27.2.12479018"; then ok=1; break; fi
            echo "sdkmanager attempt $i failed; retrying in 15s"
            rm -rf /usr/local/lib/android/sdk/ndk/27.2.12479018
            sleep 15
          done
          test "$ok" = 1 && test -f /usr/local/lib/android/sdk/ndk/27.2.12479018/source.properties
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Save NDK cache
        if: steps.ndk-install.outputs.ok == 'true'
        uses: actions/cache/save@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/27.2.12479018
          key: ndk-27.2.12479018

      - name: Build release APK (afat)
        env:
          AMINGRAM_KEYSTORE_PASSWORD: ${{ secrets.AMINGRAM_KEYSTORE_PASSWORD }}
          AMINGRAM_KEY_ALIAS: ${{ secrets.AMINGRAM_KEY_ALIAS }}
          AMINGRAM_KEY_PASSWORD: ${{ secrets.AMINGRAM_KEY_PASSWORD }}
        run: |
          cd upstream
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatRelease --stacktrace -PRELEASE_STORE_PASSWORD="$AMINGRAM_KEYSTORE_PASSWORD" -PRELEASE_KEY_ALIAS="$AMINGRAM_KEY_ALIAS" -PRELEASE_KEY_PASSWORD="$AMINGRAM_KEY_PASSWORD"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AminGram-apk
          path: upstream/TMessagesProj_App/build/outputs/apk/afat/release/*.apk
          if-no-files-found: warn

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v13.2.2-amingram.${{ github.run_number }}
          name: AminGram ${{ github.run_number }}
          files: upstream/TMessagesProj_App/build/outputs/apk/afat/release/*.apk
          fail_on_unmatched_files: true
